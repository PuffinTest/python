[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puffintest"
version = "0.1.0"
description = "Small, readable test cases and failure reports for Python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PuffinTest contributors"}]

[project.scripts]
puffintest = "puffintest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
